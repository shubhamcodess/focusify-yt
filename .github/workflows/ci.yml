name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      # Every run keeps a downloadable build under the run's "Artifacts" section.
      - uses: actions/upload-artifact@v4
        with:
          name: focusify-yt-extension
          path: dist/*.zip
          if-no-files-found: error
